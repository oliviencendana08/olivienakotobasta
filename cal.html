<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
body{
    font-family: Arial, ;
    text-align:center;
    margin-top:60px;
    background-color:#fff0f6;
    color:#5a2a3a;
}


.container{
    background:#ffd6e7;
    padding:25px;
    display:inline-block;
    border-radius:10px;
    box-shadow:0 0 10px rgba(255,105,180,0.3);
}


input{
    padding:10px;
    margin:8px;
    width:150px;
    border:1px solid #ff4f81;
    border-radius:5px;
}


button{
    margin:5px;
    padding:10px 15px;
    background:#ff4f81;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}


.dark{
    background:#1a1a1a;
    color:#fff;
}

.dark .container{
    background:#2a2a2a;
}

.dark input{
    background:#333;
    color:white;
    border:1px solid #ff4f81;
}

</style>
</head>

<body>

<h2>Calculator</h2>

<div class="container">

<input type="number" id="num1" placeholder="Number 1"><br>
<input type="number" id="num2" placeholder="Number 2"><br><br>

<button onclick="calculate('+')">+</button>
<button onclick="calculate('-')">-</button>
<button onclick="calculate('*')">*</button>
<button onclick="calculate('/')">/</button>
<button onclick="calculate('%')">%</button>

<br><br>

<button onclick="toggleDark()">Dark Mode</button>

</div>

<script>

function calculate(op){
    let n1 = parseFloat(document.getElementById("num1").value);
    let n2 = parseFloat(document.getElementById("num2").value);
    let result;

    if(isNaN(n1) || isNaN(n2)){
        alert("Enter both numbers!");
        return;
    }

    switch(op){
        case '+': result = n1 + n2; break;
        case '-': result = n1 - n2; break;
        case '*': result = n1 * n2; break;
        case '/':
            if(n2 === 0){
                alert("Cannot divide by zero!");
                return;
            }
            result = n1 / n2;
            break;
        case '%': result = n1 % n2; break;
    }

    alert("Result: " + result);
}

function toggleDark(){
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
